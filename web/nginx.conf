server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API: forwarded to the "api" service by its Docker DNS name
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # health check and Swagger UI through the same origin
    location = /health { proxy_pass http://api:8000; }
    location = /docs { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }

    # hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # single-page app: unknown paths fall back to index.html (client-side routing)
    location / {
        try_files $uri /index.html;
    }
}
