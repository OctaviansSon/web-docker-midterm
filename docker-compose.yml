name: devops-planner

services:
  db:
    image: postgres:16-alpine
    container_name: planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume: data survives `docker compose down`
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # no "ports": the database is reachable only from the backend network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-planner-api:1.0
    container_name: planner-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # start the API only when Postgres accepts connections
    environment:
      # "db" is the service name = DNS name inside the Docker network
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${API_PORT:-8000}:8000"      # host:container
    networks:
      - backend

  web:
    profiles: ["web"]                 # optional: start with `docker compose --profile web up --build`
    build:
      context: ./web
    image: devops-planner-web:1.0
    container_name: planner-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
